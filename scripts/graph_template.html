<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decisions · __TITLE__</title>
<style>
/* ==================================================================== tokens
   An observatory for a project's reasoning: a deep cobalt-gray night field, decisions as ivory
   cards lit by soft azure light, links drawn in light. Header and panel stay calm ivory paper. */
:root {
  --ivory: #FBF8EF;  --paper: #FFFEF9;  --paper-2: #F3EFE2;  --paper-edge: #E6E1D2;
  --cobalt: #3A4556; --cobalt-soft: #6E7889; --cobalt-mist: #A7B0BE;
  --night-1: #2B3442; --night-2: #212833; --night-3: #171C24;
  --azure: #8EC2EC;  --azure-hi: #B9DBF6; --azure-deep: #4A86C0; --azure-wash: #E6F1FB;
  --brick: #C26A5E;  --brick-hi: #E39486; --brick-wash: #F8E9E4;
  --ochre: #BF9447;  --ochre-hi: #E2BC72; --ochre-wash: #F7EFDD;
  --ink: var(--cobalt); --muted: var(--cobalt-soft); --line: #E2DDCF;
  --chrome: var(--ivory); --chrome-2: var(--paper);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --spring: cubic-bezier(.34, 1.45, .64, 1);
  --card-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 2px 4px rgba(8, 12, 18, .25), 0 14px 34px rgba(8, 12, 18, .35);
}
@media (prefers-color-scheme: dark) {
  :root { --chrome: #1E242E; --chrome-2: #242B36; --ink: #F3EFE3; --muted: #A5AEBD; --line: #353E4C;
          --azure-wash: #22344A; --brick-wash: #3A2A2A; --ochre-wash: #3A3224; }
}
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--night-2); color: var(--ink); font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--azure-deep); outline-offset: 2px; }

/* ==================================================================== shapes: what a decision is, at a glance */
/* foundation: things rest on it, it rests on nothing -> an elongated hexagon */
.card[data-shape=hex] { filter: drop-shadow(0 10px 16px rgba(8,12,18,.42)) drop-shadow(0 2px 3px rgba(8,12,18,.25)); }
.card[data-shape=hex] .face { clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 18px 100%, 0 50%);
  border-radius: 0; border: 0; padding: 12px 30px 13px 30px; box-shadow: none !important;
  background: linear-gradient(165deg, #FFFEFA 0%, #F7F2E4 60%, #EDE6D3 100%); }
.card[data-shape=hex] .face::before { left: 0; right: 0; top: 0; bottom: auto; width: auto; height: 4px; }
.card[data-shape=hex]:hover .face::before { width: auto; height: 6px; }
.card[data-shape=hex].sel, .card[data-shape=hex].up, .searching .card[data-shape=hex].hit, .card[data-shape=hex].is-new {
  filter: drop-shadow(0 0 1.5px var(--azure)) drop-shadow(0 0 1.5px var(--azure)) drop-shadow(0 0 14px rgba(142,194,236,.55)) drop-shadow(0 12px 18px rgba(8,12,18,.45)); }
.card[data-shape=hex].down { filter: drop-shadow(0 0 1.5px #C9D6EA) drop-shadow(0 0 1.5px #C9D6EA) drop-shadow(0 0 12px rgba(201,214,234,.4)); }
.card[data-shape=hex][data-s=stale] { filter: drop-shadow(0 0 1.5px var(--brick)) drop-shadow(0 0 16px rgba(227,148,134,.45)) drop-shadow(0 10px 16px rgba(8,12,18,.42)); }
.card.sel[data-shape=hex]::before, .card.sel[data-shape=hex]::after { display: none; }
.fan { font-size: 10.5px; font-weight: 650; color: var(--azure-deep); white-space: nowrap; }
/* standalone: nothing rests on it and it rests on nothing -> a capsule */
.card[data-shape=capsule] .face { border-radius: 999px; padding: 11px 24px 12px 30px; }
.card[data-shape=capsule] .face::before { left: 13px; top: 28%; bottom: 28%; width: 4px; border-radius: 4px; }
.card[data-shape=capsule]:hover .face::before { width: 5px; }
.card[data-shape=capsule] .txt { -webkit-line-clamp: 2; }
.card.sel[data-shape=capsule]::before { border-radius: 999px; } .card.sel[data-shape=capsule]::after { border-radius: 999px; }
/* replaced or rejected: a ticket with notched sides, kept for the record */
.card[data-shape=ticket] .face { -webkit-mask: radial-gradient(circle 9px at 0 50%, transparent 97%, #000) left / 51% 100% no-repeat,
  radial-gradient(circle 9px at 100% 50%, transparent 97%, #000) right / 51% 100% no-repeat;
  mask: radial-gradient(circle 9px at 0 50%, transparent 97%, #000) left / 51% 100% no-repeat,
  radial-gradient(circle 9px at 100% 50%, transparent 97%, #000) right / 51% 100% no-repeat; padding-left: 22px; }
/* sub-decisions plug into what they rest on: small ports where the links meet the card */
.port { position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; z-index: 2; pointer-events: none;
  background: var(--night-2); border: 2px solid rgba(185, 219, 246, .9); box-shadow: 0 0 8px rgba(142,194,236,.5); }
.port.in { left: -6px; } .port.out { right: -6px; }
.card[data-s=stale] .port.in { border-color: var(--brick-hi); box-shadow: 0 0 8px rgba(227,148,134,.6); }
#world.far .port { transform: scale(1.6); }
/* families: a foundation and everything that rests on it */
.family { position: absolute; border-radius: 26px; border: 1px solid rgba(185, 219, 246, .16); pointer-events: none;
  background: linear-gradient(160deg, rgba(142, 194, 236, .07), rgba(142, 194, 236, .02) 60%, rgba(23, 28, 36, .05));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04); animation: fade .9s var(--ease) .2s both; }
/* the title scales as one piece (id, text, fold arrow, all in em) and never leaves its box */
.family .ftitle { position: absolute; left: 18px; right: 14px; top: 10px; height: 30px; display: flex; align-items: center; gap: .55em;
  pointer-events: none; font: italic 15px var(--serif); color: rgba(251, 248, 239, .74); white-space: nowrap; }
.family .ftitle b { flex: none; font: 600 .77em var(--sans); font-style: normal; color: var(--azure-hi); letter-spacing: .02em; }
.family .ftitle .ftxt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.family .ftitle button { all: unset; flex: none; pointer-events: auto; cursor: pointer; width: 1.45em; height: 1.45em; border-radius: .45em;
  display: grid; place-items: center; color: #DCE6F2; background: rgba(142,194,236,.14); font: .8em var(--sans); font-style: normal; }
.family .ftitle button:hover { background: rgba(142,194,236,.3); }
.family .ftitle button:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
#world.far .family .ftitle { font-size: clamp(15px, calc(12px * var(--inv, 1)), 23px); }
path.e.cross { opacity: .28; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; height: 34px; }
.seg button { all: unset; cursor: pointer; padding: 0 12px; font: 13px var(--sans); color: var(--muted); display: grid; place-items: center; }
.seg button[aria-pressed=true] { background: var(--azure-wash); color: var(--azure-deep); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--azure); outline-offset: -2px; }
@media (prefers-color-scheme: dark) { .seg button[aria-pressed=true] { background: rgba(142,194,236,.18); color: var(--azure-hi); } }

/* ==================================================================== tools: area filter, list, palette, timeline, export */
.tool { height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--chrome-2); color: var(--ink);
  font: 13px var(--sans); padding: 0 12px; cursor: pointer; }
.tool:hover { border-color: var(--azure); }
.tool:focus-visible, .zoom button:focus-visible, #timeline button:focus-visible, #list button:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
select.tool { padding-right: 8px; }
kbd { font: 11px var(--sans); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--chrome-2); }
.tag { font-size: 10.5px; color: var(--cobalt-soft); border: 1px solid rgba(58,69,86,.18); padding: 0 6px; border-radius: 99px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
.newmark.changed { color: #8A6A2E; background: #F6ECD8; }
#palette { position: fixed; inset: 0; z-index: 30; background: rgba(10, 14, 20, .45); backdrop-filter: blur(3px); }
#palette .box { width: min(640px, 92vw); margin: 12vh auto 0; border-radius: 16px; background: var(--chrome); border: 1px solid var(--line);
  box-shadow: 0 30px 80px rgba(0,0,0,.45); overflow: hidden; animation: rise-sm .25s var(--ease) both; }
#palq { width: 100%; box-sizing: border-box; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink);
  font: 18px var(--serif); padding: 18px 20px; outline: none; }
#palres { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
#palres li { display: flex; gap: 12px; align-items: baseline; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
#palres li.on { background: color-mix(in srgb, var(--azure) 18%, transparent); }
#palres .pid { font: 600 12px var(--sans); color: var(--muted); min-width: 38px; }
#palres .ptxt { flex: 1; font: 15px/1.4 var(--serif); }
#palres .pst { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
#palres .none { color: var(--muted); cursor: default; }
#palette .foot { padding: 8px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
#list { position: absolute; inset: 0; z-index: 6; overflow: auto; background: var(--chrome); color: var(--ink); padding: 18px 26px 40px; }
#list .count { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
#list table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
#list th { position: sticky; top: -18px; background: var(--chrome); text-align: left; border-bottom: 1px solid var(--line); padding: 0; z-index: 1; }
#list th button { all: unset; display: block; padding: 10px 10px; font-weight: 650; font-size: 12.5px; color: var(--muted); cursor: pointer; }
#list th button:hover { color: var(--ink); }
#list td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
#list tbody tr { cursor: pointer; }
#list tbody tr:hover, #list tbody tr:focus-visible { background: color-mix(in srgb, var(--azure) 10%, transparent); outline: none; }
#list tbody tr.sel { background: color-mix(in srgb, var(--azure) 20%, transparent); }
#list td.dec { font: 15px/1.4 var(--serif); }
#list td.id { font-weight: 650; white-space: nowrap; }
#list .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#list td.muted { color: var(--muted); white-space: nowrap; }
body:not(.listing) #list { display: none; }
[hidden] { display: none !important; }
#timeline { left: 76px; right: 250px; bottom: 18px; margin: 0 auto; max-width: 640px; display: flex; align-items: center; gap: 12px;
  padding: 8px 16px 8px 8px; color: #DCE6F2; font-size: 12.5px; animation: rise-sm .8s var(--ease) 1.2s both; }
#timeline button { width: 34px; height: 34px; border: 0; border-radius: 9px; background: rgba(142,194,236,.16); color: #fff; cursor: pointer; font-size: 13px; flex: none; }
#timeline button:hover { background: rgba(142,194,236,.3); }
#timeline input { flex: 1; accent-color: var(--azure); min-width: 80px; }
#tll { white-space: nowrap; min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; }
body.timetravel #timeline { box-shadow: 0 0 0 1.5px var(--ochre), 0 10px 30px rgba(0,0,0,.35); }
body.timetravel #tll { color: #F2D9A6; }
#expmenu { left: 64px; bottom: 82px; z-index: 9; padding: 6px; display: flex; flex-direction: column; gap: 2px;
  box-shadow: 0 16px 40px rgba(0,0,0,.45); }
#expmenu button { border: 0; background: transparent; color: #DCE6F2; text-align: left; padding: 8px 12px; border-radius: 8px; cursor: pointer; font: 13px var(--sans); }
#expmenu button:hover { background: rgba(142,194,236,.18); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 860px) { #timeline { right: 16px; } #tll { min-width: 0; } }

/* ==================================================================== header (ivory paper) */
header { position: relative; z-index: 5; display: flex; align-items: center; gap: 22px; padding: 14px 24px; flex-wrap: wrap;
  background: var(--chrome); border-bottom: 1px solid var(--line); box-shadow: 0 8px 30px rgba(8, 12, 18, .18);
  animation: drop .8s var(--ease) both; }
.title h1 { margin: 0; font: 600 21px/1.15 var(--serif); letter-spacing: -.012em; }
.title h1 span { background: linear-gradient(100deg, var(--azure-deep), var(--azure) 60%, var(--azure-deep)); background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 6s ease-in-out infinite; }
.title .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; display: inline; }
.snapnote { color: var(--muted); font-size: 12.5px; }
.snapnote code { font-size: 12px; padding: 1px 5px; border-radius: 4px; background: rgba(142,194,236,.14); }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px 5px 10px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--chrome-2); cursor: pointer; font-size: 12.5px; user-select: none; animation: rise-sm .6s var(--ease) both;
  transition: background .25s var(--ease), border-color .25s, transform .3s var(--spring), box-shadow .25s; }
.chip:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(58, 69, 86, .12); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--azure); box-shadow: 0 0 0 3px color-mix(in srgb, var(--azure) 25%, transparent); }
.chip[data-s=stale] i { background: var(--brick); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brick) 22%, transparent); }
.chip[data-s=indirect] i { background: var(--ochre); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ochre) 22%, transparent); }
.chip[data-s=resolved] i { background: var(--azure-deep); }
.chip b { font-weight: 650; font-variant-numeric: tabular-nums; }
.chip.on { background: var(--cobalt); border-color: var(--cobalt); color: var(--ivory); }
.spacer { flex: 1; }
.search { position: relative; }
.search input { width: 250px; padding: 8px 12px 8px 33px; border-radius: 11px; border: 1px solid var(--line); background: var(--chrome-2);
  transition: width .45s var(--ease), border-color .2s, box-shadow .3s; }
.search input:focus { width: 320px; outline: none; border-color: var(--azure); box-shadow: 0 0 0 4px color-mix(in srgb, var(--azure) 35%, transparent); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); }
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; user-select: none; font-size: 13px; color: var(--muted); }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .track { width: 36px; height: 21px; border-radius: 99px; background: var(--line); position: relative; transition: background .35s var(--ease); }
.switch .track::after { content: ""; position: absolute; top: 2.5px; left: 2.5px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper);
  box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .45s var(--spring), width .2s; }
.switch:active .track::after { width: 20px; }
.switch input:checked + .track { background: linear-gradient(90deg, var(--azure-deep), var(--azure)); }
.switch input:checked + .track::after { transform: translateX(15px); }
.switch input:focus-visible + .track { outline: 2px solid var(--azure-deep); outline-offset: 2px; }

/* ==================================================================== the night field */
main { display: flex; height: calc(100% - 71px); }
#stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#stage #list { -webkit-user-select: text; user-select: text; }
#stage { flex: 1; position: relative; overflow: hidden; overflow: clip; cursor: grab; touch-action: none; isolation: isolate;
  background: radial-gradient(140% 120% at 30% 10%, var(--night-1), var(--night-2) 55%, var(--night-3)); }
#stage.dragging { cursor: grabbing; }
.aurora { position: absolute; inset: -20%; z-index: -2; pointer-events: none; filter: blur(60px); opacity: .55; }
.aurora i { position: absolute; border-radius: 50%; mix-blend-mode: screen; }
.aurora i:nth-child(1) { width: 55%; height: 45%; left: 5%; top: 8%; background: radial-gradient(closest-side, rgba(142,194,236,.55), transparent); animation: drift-a 26s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { width: 45%; height: 50%; right: 4%; top: 30%; background: radial-gradient(closest-side, rgba(74,134,192,.55), transparent); animation: drift-b 32s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { width: 40%; height: 35%; left: 35%; bottom: 0; background: radial-gradient(closest-side, rgba(185,219,246,.30), transparent); animation: drift-c 38s ease-in-out infinite alternate; }
.grid { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: .9;
  background-image: radial-gradient(rgba(251,248,239,.10) 1px, transparent 1.4px); background-size: 24px 24px; }
.grid.far { opacity: .5; background-image: radial-gradient(rgba(185,219,246,.10) 1.2px, transparent 1.6px); background-size: 72px 72px; }
.spot { position: absolute; z-index: -1; width: 560px; height: 560px; left: 0; top: 0; pointer-events: none; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(142,194,236,.14), transparent); transform: translate(var(--sx, -999px), var(--sy, -999px));
  transition: opacity .6s; mix-blend-mode: screen; }
#stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(120% 95% at 50% 45%, transparent 60%, rgba(10, 14, 20, .55)); }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges path.e { pointer-events: visibleStroke; }

/* ==================================================================== cards: ivory paper floating in the field */
.card { position: absolute; width: 264px; perspective: 900px; transition: transform .8s var(--ease), filter .5s var(--ease), opacity .5s var(--ease); }
.face { position: relative; height: 100%; box-sizing: border-box; padding: 12px 15px 14px 18px; border-radius: 14px; cursor: pointer; overflow: hidden;
  background: linear-gradient(165deg, var(--paper) 0%, var(--ivory) 70%, var(--paper-2) 100%);
  border: 1px solid rgba(255, 255, 255, .7); box-shadow: var(--card-shadow); color: var(--cobalt);
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(0);
  transition: transform .5s var(--ease), box-shadow .5s var(--ease), opacity .5s var(--ease);
  animation: emerge 1s var(--ease) both; animation-delay: var(--d, 0ms); }
.face::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--azure); transition: width .35s var(--ease); }
.face .sheen { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.75), transparent 45%); mix-blend-mode: soft-light; }
.card:hover .face { box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 10px rgba(8,12,18,.25), 0 26px 50px rgba(8,12,18,.45), 0 0 0 1px rgba(185,219,246,.5); }
.card:hover .face .sheen { opacity: 1; }
.card:hover .face::before { width: 6px; }
.meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11.5px; color: var(--cobalt-soft); }
.cid { font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.mine { color: var(--azure-deep); font-weight: 700; }
.pill { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 8px 1px 7px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.txt { margin: 0; font: 15.5px/1.38 var(--serif); color: var(--cobalt); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card[data-s=stale] .face::before { background: var(--brick); }
.card[data-s=stale] .pill { color: var(--brick); background: var(--brick-wash); }
.card[data-s=stale] .face { box-shadow: var(--card-shadow), 0 0 0 1px rgba(194,106,94,.35), 0 0 28px rgba(227,148,134,.28); animation: emerge 1s var(--ease) both, ember 3.2s ease-in-out 1.2s infinite; animation-delay: var(--d, 0ms), calc(var(--d, 0ms) + 1.2s); }
.card[data-s=stale] .pill i { animation: beat 2.4s ease-in-out infinite; }
.card[data-s=indirect] .face::before { background: var(--ochre); }
.card[data-s=indirect] .pill { color: #9A7432; background: var(--ochre-wash); }
.card[data-s=resolved] .face::before { background: var(--azure-deep); }
.card[data-s=resolved] .pill { color: var(--azure-deep); background: var(--azure-wash); }
.card[data-s=replaced] .face, .card[data-s=rejected] .face { background: linear-gradient(165deg, #E4DFD3 0%, #D7D1C3 100%);
  border: 1.5px dashed rgba(58, 69, 86, .4); box-shadow: 0 2px 8px rgba(8, 12, 18, .32); }
.card[data-s=replaced] .txt, .card[data-s=rejected] .txt { color: #4B5566; }
.card[data-s=replaced] .meta, .card[data-s=rejected] .meta { color: #5C6676; }
.card[data-s=replaced] .face::before { background: repeating-linear-gradient(180deg, #8A93A2 0 6px, transparent 6px 10px); }
.card[data-s=replaced] .pill { color: #3F4A5B; background: rgba(58, 69, 86, .12); }
.card[data-s=rejected] .face::before { background: var(--brick-hi); opacity: .6; }

  letter-spacing: .02em; animation: glint 2.6s ease-in-out 3; }
.card.is-new .face { box-shadow: var(--card-shadow), 0 0 0 1.5px rgba(142,194,236,.7), 0 0 30px rgba(142,194,236,.35); }

#empty { position: absolute; inset: 0 0 8% 0; margin: auto; height: fit-content; z-index: 3; width: min(520px, 86%); text-align: center;

#empty .live { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--azure-hi); }
#empty .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--azure); animation: beat 2s ease-in-out infinite; }
/* zoomed out: cards become headlines whose text stays a readable size on screen */
#world.far .face { padding: 9px 12px 9px 16px; }
#world.far .meta .pill, #world.far .meta .mine, #world.far .sheen { display: none; }

.section { position: absolute; transform: translateY(-100%); font: italic 15px var(--serif); color: rgba(251, 248, 239, .62); white-space: nowrap; animation: fade 1.2s var(--ease) .9s both; letter-spacing: .01em; }

/* ==================================================================== instruments: zoom, minimap */

  transition: background-size .35s var(--ease); }

.btn:disabled { opacity: .5; pointer-events: none; }
textarea, input.note { width: 100%; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; background: var(--chrome-2);
  transition: border-color .2s, box-shadow .3s; }
textarea:focus, input.note:focus { outline: none; border-color: var(--azure); box-shadow: 0 0 0 4px color-mix(in srgb, var(--azure) 35%, transparent); }
textarea { min-height: 88px; resize: vertical; font: 18px/1.4 var(--serif); }

.empty { color: var(--muted); font-style: italic; }
.intro { font: italic 16px/1.55 var(--serif); color: var(--muted); margin: 0 0 20px; }

#toast { position: fixed; left: 50%; bottom: 28px; z-index: 9; display: flex; align-items: center; gap: 12px; max-width: 80vw; overflow: hidden;
  padding: 11px 12px 13px 16px; border-radius: 13px; background: rgba(23, 28, 36, .92); color: var(--ivory); backdrop-filter: blur(12px);
  border: 1px solid rgba(185, 219, 246, .18); box-shadow: 0 18px 40px rgba(0, 0, 0, .4); font-size: 13.5px;
  transform: translate(-50%, 160%) scale(.96); opacity: 0; transition: transform .6s var(--spring), opacity .35s; }

  transform-origin: left; animation: drain var(--t, 5s) linear forwards; }
#toast button { border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06); color: inherit; border-radius: 9px; padding: 4px 11px; cursor: pointer;
  transition: background .2s; }
#toast button:hover { background: rgba(255,255,255,.16); }

/* ==================================================================== motion */
@keyframes emerge { from { opacity: 0; transform: translateZ(-160px) translateY(26px) scale(.86) rotateX(14deg); filter: blur(8px); }
                    to { opacity: 1; filter: blur(0); } }
@keyframes rise-sm { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
@keyframes slide-left { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
@keyframes panel-in { from { opacity: 0; transform: translateY(12px); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }

@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes beat { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.7); opacity: .5; } }
@keyframes ember { 0%, 100% { box-shadow: var(--card-shadow), 0 0 0 1px rgba(194,106,94,.35), 0 0 22px rgba(227,148,134,.18); }
                   50% { box-shadow: var(--card-shadow), 0 0 0 1px rgba(194,106,94,.55), 0 0 38px rgba(227,148,134,.42); } }
@keyframes spin { to { --spin: 360deg; } }
@keyframes breathe { 0%, 100% { opacity: .55; transform: translateY(-4px) scale(1); } 50% { opacity: 1; transform: translateY(-4px) scale(1.04); } }
@keyframes shimmer { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
@keyframes glint { 0%, 100% { box-shadow: none; } 50% { box-shadow: 0 0 0 4px rgba(142,194,236,.35); } }
@keyframes breathe-orb { 0%, 100% { transform: scale(1); box-shadow: 0 0 50px rgba(142,194,236,.45); } 50% { transform: scale(1.06); box-shadow: 0 0 80px rgba(142,194,236,.7); } }
@keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes fold { 0% { opacity: 1; } 35% { transform: scale(1.05) rotate(-1deg); } 100% { opacity: 0; transform: scale(.4) translateY(40px) rotate(6deg); filter: blur(8px); } }
@keyframes drift-a { to { transform: translate(18%, 12%) scale(1.15); } }
@keyframes drift-b { to { transform: translate(-16%, -10%) scale(.9); } }
@keyframes drift-c { to { transform: translate(-12%, -18%) scale(1.2); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media (max-width: 860px) {

  .search input { width: 150px; } .search input:focus { width: 180px; }
  .switch { font-size: 0; gap: 0; }

  aside { width: auto; height: 40%; border-left: 0; border-top: 1px solid var(--line); }
  .card { width: 224px; } .minimap { display: none; }
}

<body>
<header>
  <div class="title">
    <h1>Decisions in <span id="pname"></span></h1>
    <div class="sub" id="gen"></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="Search decisions and reasons" aria-label="Search decisions and reasons" autocomplete="off" spellcheck="false"></label>
  <select class="tool" id="area" aria-label="Show one area" hidden></select>
  <div class="seg" role="group" aria-label="Layout"><button data-l="flow" aria-pressed="true" title="Everything left to right, in the order decisions rest on each other">Flow</button><button data-l="families" aria-pressed="false" title="Each foundation decision with the decisions that rest on it">Families</button></div>
  <button class="tool" id="listBtn" aria-pressed="false" title="Show the decisions as a table">List</button>
  <label class="switch"><input type="checkbox" id="showReplaced"><span class="track"></span>Show replaced</label>
</header>
<main>
  <div id="stage">
    <div class="aurora"><i></i><i></i><i></i></div>
    <div class="grid far" id="gridFar"></div>
    <div class="grid" id="grid"></div>
    <div class="spot" id="spot"></div>
    <div id="world"><svg id="edges"></svg></div>
    <div id="empty" hidden></div>
    <div class="zoom glass"><button id="zin" title="Zoom in" aria-label="Zoom in">+</button><button id="zout" title="Zoom out" aria-label="Zoom out">−</button><button id="fit" title="Fit to screen (F)" aria-label="Fit to screen">⤢</button><button id="exp" title="Download as an image" aria-label="Download as an image" aria-haspopup="true">⤓</button></div>
    <div class="glass" id="expmenu" hidden><button data-k="svg">Download SVG (sharp, for docs)</button><button data-k="png">Download PNG (for slides)</button></div>
    <div class="glass" id="timeline" hidden><button id="tlp" aria-label="Play the project's history">▶</button>
      <input type="range" id="tlr" aria-label="Show the decisions as they were on a date"><span id="tll" aria-live="polite"></span></div>

  <input id="palq" placeholder="Go to a decision: type words or an id" aria-label="Go to a decision" aria-controls="palres" autocomplete="off">
  <ul id="palres" role="listbox"></ul><div class="foot"><kbd>↑</kbd> <kbd>↓</kbd> to choose, <kbd>Enter</kbd> to go, <kbd>Esc</kbd> to close</div></div></div>
<script>
let DATA = /*__DATA__*/null;
const EDIT = /*__EDIT__*/null;   // set when served by `dg view`: corrections allowed
let byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const LABEL = { ok: "In force", stale: "Stale", indirect: "Indirectly affected", resolved: "Resolved", replaced: "Replaced", rejected: "Rejected by you" };
const STATUS_COLOR = { ok: "#8EC2EC", stale: "#E39486", indirect: "#E2BC72", resolved: "#4A86C0", replaced: "#B4BCC8", rejected: "#C98B80" };
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const SMALL_MQ = matchMedia("(max-width: 860px)");
let SMALL = SMALL_MQ.matches;   // re-checked on resize: the page may first load in a narrow pane
const NS = "http://www.w3.org/2000/svg";
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const num = id => parseInt(String(id).replace(/\D/g, ""), 10) || 0;

let showReplaced = false, statusFilter = null, selected = null, firstRender = true;
let topicFilter = null, listMode = false, FULL = DATA, asOfIdx = null;
let layoutMode = "flow", shapeOf = {}, familyOf = null, memberOf = {}, fanOf = {};
const collapsed = new Set();
try { layoutMode = localStorage.getItem("dg-layout") === "families" ? "families" : "flow";
      JSON.parse(localStorage.getItem("dg-collapsed-" + DATA.project) || "[]").forEach(x => collapsed.add(x)); } catch (e) {}
let view = { x: 40, y: 30, k: 1 };
const pos = {}, cards = {};
let EDGES = [];
let COLW = SMALL ? 224 : 264, GAPX = SMALL ? 70 : 120;
const GAPY = 20, GRID_GAP = 22;
let laidOutFor = null;   // the stage size the current layout was chosen for

$("#pname").textContent = DATA.project;

// ==================================================================== header
function countUp(b, to) {
  if (REDUCED || !firstRender) { b.textContent = to; return; }
  const t0 = performance.now(), dur = 900;
  const step = now => { const t = Math.min(1, (now - t0) / dur); b.textContent = Math.round(to * (1 - Math.pow(1 - t, 3))); if (t < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function renderStats() {
  const counts = {};
  DATA.nodes.forEach(n => counts[n.status] = (counts[n.status] || 0) + 1);

// ==================================================================== families: each foundation with what rests on it
function saveCollapsed() { try { localStorage.setItem("dg-collapsed-" + DATA.project, JSON.stringify([...collapsed])); } catch (e) {} }

  const world = $("#world"), FP = 22, TITLE = 44, FGAP = 56, BGAP = 36;
  const layerOf = {}; cols.forEach((c, L) => c.forEach(id => layerOf[id] = L));
  const linked = cols.flat();
  // each decision sits under one parent: the most specific thing it rests on (the deepest one)
  const parentOf = {}, kids = {};
  linked.forEach(id => {
    const ps = preds[id].filter(p => layerOf[p] != null).sort((a, b) => layerOf[b] - layerOf[a] || num(a) - num(b));
    parentOf[id] = ps[0] || null;
    if (ps[0]) (kids[ps[0]] ||= []).push(id);
  });
  Object.values(kids).forEach(k => k.sort((a, b) => num(a) - num(b)));
  const roots = linked.filter(id => !parentOf[id]);
  familyOf = {}; memberOf = {};
  const membersOf = r => { const out = [], st = [r]; while (st.length) { const x = st.pop(); out.push(x); (kids[x] || []).forEach(k => st.push(k)); } return out; };
  roots.forEach(r => membersOf(r).forEach(m => { familyOf[m] = r; memberOf[m] = r; }));

    const members = membersOf(r), shut = collapsed.has(r) && members.length > 1;
    const rel = {}; let maxDepth = 0;
    const show = shut ? [r] : members;
    show.forEach(id => makeCard(id, delayFor(id, 200 + Math.min(order++, 30) * 45)));
    const walk = (id, depth, y) => {
      maxDepth = Math.max(maxDepth, depth);
      rel[id] = { x: depth * (COLW + FGAP), y };
      const h = cards[id].offsetHeight;
      let next = y;
      const ks = shut ? [] : (kids[id] || []);
      if (!ks.length) return y + h + GAPY;
      ks.forEach(k => { next = walk(k, depth + 1, next); });
      return Math.max(y + h + GAPY, next);
    };
    const inner = walk(r, 0, 0) - GAPY;
    return { r, members, shut, rel, w: (maxDepth + 1) * (COLW + FGAP) - FGAP + FP * 2, h: inner + FP * 2 + TITLE };
  });

    let x = 0, y = 0, rowH = 0, W = 0; const at = [];

    const hs = nSt ? 90 + Math.ceil(nSt / per) * (avgSt + GRID_GAP) : 0;
    const k = Math.min(fitW / Math.max(p.W, COLW), fitH / (p.H + hs + 90));
    if (k > bestK + 1e-3) { bestK = k; best = p; }
  }
  best = best || pack(total);
  let bottom = 0, right = 0;
  blocks.forEach((b, i) => {
    const { x, y } = best.at[i];
    const box = el("div", "family");
    Object.assign(box.style, { left: x + "px", top: y + "px", width: b.w + "px", height: b.h + "px" });
    const t = el("div", "ftitle"), n = byId[b.r];
    const subs = b.members.length - 1;
    t.append(el("b", null, b.r));
    const area = n.topic ? n.topic.charAt(0).toUpperCase() + n.topic.slice(1) + ": " : "";
    const txt = el("span", "ftxt", subs ? `${area}${subs} sub-decision${subs === 1 ? "" : "s"}${b.shut ? ", folded" : ""}`
                                         : `${area}what rests on it sits in another family`);
    txt.title = txt.textContent;
    t.append(txt);
    if (subs) {
      const btn = el("button", null, b.shut ? "▸" : "▾");
      btn.setAttribute("aria-label", (b.shut ? "Unfold " : "Fold ") + b.r + "'s family");
      btn.setAttribute("aria-expanded", !b.shut);

      btn.onpointerdown = ev => ev.stopPropagation();

  }

  renderStats(); renderAreas(); render(); renderPanel(); tlLabel();
}
function tlLabel() {
  const act = DATA.nodes.filter(n => n.status !== "replaced" && n.status !== "rejected").length;
  $("#tll").textContent = asOfIdx == null ? `Now: ${act} in force` : `${fmtDay(DAYS[asOfIdx])}: ${act} in force`;
}
function stopPlay() { clearTimeout(playTimer); playTimer = null; $("#tlp").textContent = "▶"; $("#tlp").setAttribute("aria-label", "Play the project's history"); }
$("#tlp").onclick = () => {
  if (playTimer) { stopPlay(); return; }
  let i = asOfIdx == null || asOfIdx >= DAYS.length - 1 ? 0 : asOfIdx + 1;
  $("#tlp").textContent = "❚❚"; $("#tlp").setAttribute("aria-label", "Pause");
  const step = () => {
    setAsOf(i); fit();
    if (i >= DAYS.length) { stopPlay(); return; }
    i++; playTimer = setTimeout(step, REDUCED ? 600 : 1500);
  };
  step();
};
let scrubRaf = null;
$("#tlr").addEventListener("input", e => {
  stopPlay();
  cancelAnimationFrame(scrubRaf);
  scrubRaf = requestAnimationFrame(() => setAsOf(+e.target.value));
});
$("#tlr").addEventListener("change", () => fit());

// ==================================================================== download as an image
function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function graphSVG() {
  const ids = Object.keys(cards); if (!ids.length) return null;
  const esc = x => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const b = bounds(), pad = 48, top = 70;
  const x0 = b.x1 - pad, y0 = b.y1 - pad - top, W = Math.ceil(b.x2 - b.x1 + pad * 2), H = Math.ceil(b.y2 - b.y1 + pad * 2 + top);
  const ctx = document.createElement("canvas").getContext("2d");
  const SERIF = "Georgia, 'Times New Roman', serif", SANS = "'Segoe UI', Arial, sans-serif";
  const wrap = (text, maxW, font, maxLines) => {
    ctx.font = font; const words = text.split(/\s+/), lines = []; let line = "";
    for (const w of words) {
      const t = line ? line + " " + w : w;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    if (line) lines.push(line);
    if (lines.length > maxLines) { const cut = lines.slice(0, maxLines); let l = cut[maxLines - 1];
      while (ctx.measureText(l + "…").width > maxW && l.length) l = l.slice(0, -1); cut[maxLines - 1] = l.replace(/\s+\S*$/, "") + "…"; return cut; }
    return lines;
  };
  const o = [`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="${x0} ${y0} ${W} ${H}">`,
    `<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B3442"/><stop offset="1" stop-color="#171C24"/></linearGradient>`];
  [["a", "#C9D3E0"], ["r", "#E39486"], ["b", "#8EC2EC"]].forEach(([k, c]) => o.push(
    `<marker id="m${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Q3,5 1,1 z" fill="${c}"/></marker>`));
  o.push(`</defs><rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="url(#bg)"/>`);
  const asOf = asOfIdx != null ? `as of ${fmtDay(DAYS[asOfIdx])}` : `on ${new Date().toLocaleDateString()}`;
  const act = DATA.nodes.filter(n => n.status !== "replaced" && n.status !== "rejected").length;
  o.push(`<text x="${x0 + pad}" y="${y0 + pad + 6}" font-family="${SERIF}" font-size="24" fill="#FBF8EF">Decisions in ${esc(DATA.project)}</text>`);
  o.push(`<text x="${x0 + pad}" y="${y0 + pad + 30}" font-family="${SANS}" font-size="13" fill="#A5AEBD">${act} in force ${esc(asOf)}${topicFilter ? ", area: " + esc(topicFilter) : ""}</text>`);
  document.querySelectorAll("#edges path.e").forEach(p => {
    const c = p.classList, red = c.contains("via-replaced") || c.contains("dead"), blue = c.contains("via-restored") || c.contains("restores");
    const sup = c.contains("supersedes");
    const stroke = red ? "#E39486" : blue ? "#8EC2EC" : sup ? "#B4BCC8" : "rgba(251,248,239,.55)";
    const dash = red ? ' stroke-dasharray="8 6"' : blue ? ' stroke-dasharray="2 5"' : sup ? ' stroke-dasharray="5 5"' : "";
    o.push(`<path d="${p.getAttribute("d")}" fill="none" stroke="${stroke}" stroke-width="${red || blue ? 2 : 1.5}"${dash} marker-end="url(#m${red ? "r" : blue ? "b" : "a"})"/>`);
  });
  document.querySelectorAll("#world .section").forEach(sec => {
    o.push(`<text x="${parseFloat(sec.style.left) || 0}" y="${(parseFloat(sec.style.top) || 0) - 6}" font-family="${SERIF}" font-style="italic" font-size="15" fill="rgba(251,248,239,.62)">${esc(sec.textContent)}</text>`);
  });
  document.querySelectorAll("#world .family").forEach(f => {
    const fx = parseFloat(f.style.left), fy = parseFloat(f.style.top), fw = parseFloat(f.style.width), fh = parseFloat(f.style.height);
    o.push(`<rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" rx="26" fill="rgba(142,194,236,.07)" stroke="rgba(185,219,246,.2)"/>`);
    o.push(`<text x="${fx + 22}" y="${fy + 29}" font-family="${SERIF}" font-style="italic" font-size="15" fill="rgba(251,248,239,.74)">${esc(f.querySelector(".ftitle").textContent.replace(/[▸▾]/g, "").replace(/^(D-\d+)/, "$1  "))}</text>`);
  });
  ids.forEach(id => {
    const p = pos[id], n = byId[id], old = n.status === "replaced" || n.status === "rejected", shape = shapeOf[id] || "card";
    const fill = old ? "#DCD6C8" : "#FBF8EF", oldStroke = old ? ' stroke="#3A4556" stroke-opacity=".4" stroke-dasharray="5 4"' : "";
    let tx = p.x + 18, tw = p.w - 34;
    if (shape === "hex") {
      const s = 18, pts = [[p.x + s, p.y], [p.x + p.w - s, p.y], [p.x + p.w, p.y + p.h / 2], [p.x + p.w - s, p.y + p.h], [p.x + s, p.y + p.h], [p.x, p.y + p.h / 2]];
      o.push(`<polygon points="${pts.map(q => q.join(",")).join(" ")}" fill="${fill}"/>`);
      o.push(`<rect x="${p.x + s}" y="${p.y}" width="${p.w - 2 * s}" height="4" fill="${STATUS_COLOR[n.status]}"/>`);
      tx = p.x + 30; tw = p.w - 60;
    } else if (shape === "capsule") {
      o.push(`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${p.h / 2}" fill="${fill}"/>`);
      o.push(`<rect x="${p.x + 13}" y="${p.y + p.h * .28}" width="4" height="${p.h * .44}" rx="2" fill="${STATUS_COLOR[n.status]}"/>`);
      tx = p.x + 30; tw = p.w - 54;
    } else {
      o.push(`<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="14" fill="${fill}"${oldStroke}/>`);
      o.push(`<rect x="${p.x}" y="${p.y + 6}" width="4" height="${p.h - 12}" rx="2" fill="${STATUS_COLOR[n.status]}"/>`);
      if (shape === "ticket") [p.x, p.x + p.w].forEach(cx => o.push(`<circle cx="${cx}" cy="${p.y + p.h / 2}" r="9" fill="#232B37"/>`));
      if (shape === "card") o.push(`<circle cx="${p.x - 1}" cy="${p.y + p.h / 2}" r="4.5" fill="#212833" stroke="#B9DBF6" stroke-width="2"/>`);
    }
    if (shape !== "capsule" && shape !== "ticket" && fanOf[id]) o.push(`<circle cx="${p.x + p.w + 1}" cy="${p.y + p.h / 2}" r="4.5" fill="#212833" stroke="#B9DBF6" stroke-width="2"/>`);
    o.push(`<text x="${tx}" y="${p.y + 22}" font-family="${SANS}" font-size="11.5" font-weight="700" fill="#6E7889">${esc(id)}${n.topic ? "  ·  " + esc(n.topic) : ""}</text>`);
    if (n.status !== "ok") o.push(`<text x="${p.x + p.w - (shape === "hex" ? 30 : 14)}" y="${p.y + 22}" text-anchor="end" font-family="${SANS}" font-size="11" font-weight="600" fill="${n.status === "stale" ? "#B5574A" : "#5C6676"}">${esc(LABEL[n.status])}</text>`);
    const lines = wrap(n.decision, tw, `15.5px ${SERIF}`, Math.max(1, Math.floor((p.h - 36) / 21)));
    lines.forEach((l, i) => o.push(`<text x="${tx}" y="${p.y + 44 + i * 21}" font-family="${SERIF}" font-size="15.5" fill="${old ? "#4B5566" : "#3A4556"}">${esc(l)}</text>`));
  });
  o.push("</svg>");
  return { svg: o.join("\n"), W, H };
}
function exportImage(kind) {
  $("#expmenu").hidden = true;
  const g = graphSVG(); if (!g) { toast("Nothing to export yet."); return; }
  const name = `decision-graph-${DATA.project.replace(/[^A-Za-z0-9_-]+/g, "-")}${asOfIdx != null ? "-" + DAYS[asOfIdx] : ""}`;
  if (kind === "svg") { download(new Blob([g.svg], { type: "image/svg+xml" }), name + ".svg"); toast("Downloaded " + name + ".svg"); return; }
  const img = new Image();
  img.onload = () => {
    const scale = Math.min(2, 12000 / Math.max(g.W, g.H));
    const cv = document.createElement("canvas"); cv.width = Math.round(g.W * scale); cv.height = Math.round(g.H * scale);
    const c = cv.getContext("2d"); c.scale(scale, scale); c.drawImage(img, 0, 0, g.W, g.H);
    cv.toBlob(b => { if (b) { download(b, name + ".png"); toast("Downloaded " + name + ".png"); } else toast("Couldn't make the PNG; try SVG.", true); }, "image/png");
  };
  img.onerror = () => toast("Couldn't make the PNG; try SVG.", true);
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(g.svg);
}
$("#exp").onclick = e => { e.stopPropagation(); const m = $("#expmenu"); m.hidden = !m.hidden; if (!m.hidden) m.querySelector("button").focus(); };
$("#expmenu").querySelectorAll("button").forEach(b => b.onclick = () => exportImage(b.dataset.k));
document.addEventListener("pointerdown", e => { if (!e.target.closest("#expmenu, #exp")) $("#expmenu").hidden = true; });
$("#expmenu").addEventListener("keydown", e => { if (e.key === "Escape") { $("#expmenu").hidden = true; $("#exp").focus(); } });

// live: while `dg view` is running, new decisions emerge into the field as they're recorded
const arrivedLive = new Set();   // everything that arrived while this page was open stays marked new
async function poll() {
  if (document.hidden) return;
  try {
    const v = await (await fetch(`api/version?t=${EDIT.token}`)).json();
    if (v.v === DATA.version) return;
    const fresh = await (await fetch(`api/data?t=${EDIT.token}`)).json();
    const had = new Set(DATA.nodes.map(n => n.id));
    const added = fresh.nodes.filter(n => !had.has(n.id) && n.status !== "rejected" && n.status !== "replaced");
    added.forEach(n => arrivedLive.add(n.id));
    fresh.nodes.forEach(n => { if (arrivedLive.has(n.id) && n.status !== "rejected" && n.status !== "replaced") n.new = true; });
    FULL = fresh;
    if (asOfIdx == null) { DATA = fresh; byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n])); }
    buildTimeline(); renderAreas();
    if (asOfIdx != null) { if (added.length) toast(`${added.length} new decision${added.length > 1 ? "s" : ""} recorded. Move the timeline to the end to see them.`); return; }
    renderStats(); renderEmpty(); render();
    if (!selected) renderPanel();
    if (added.length) {
      toast(`${added.length} new decision${added.length > 1 ? "s" : ""} recorded: ${added.slice(0, 4).map(n => n.id).join(", ")}${added.length > 4 ? ", ..." : ""}`,
            false, null, { label: "Show", run: () => select(added[0].id) });
      setTimeout(() => fit(), 120);
    }
  } catch (e) { /* the server stopped; leave the page as it is */ }
}
if (EDIT && EDIT.live) setInterval(poll, 3500);

renderAreas(); buildTimeline(); renderStats(); renderEmpty(); render(); renderPanel(); fit(true);
</script>
